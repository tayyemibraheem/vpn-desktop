[package]
name = "tayyem-vpn-desktop"
version = "0.1.3"
description = "TayyemVPN desktop client"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
dirs = "5"
libloading = "0.8"

# NOTE: this crate has never been compiled or run — written from documented Tauri v2 / crates.io
# API shapes with no Rust toolchain available in the environment this was authored in. Treat a
# first `cargo build` on Windows as the real first compile-check, not a formality.

[[bin]]
name = "tayyem-vpn-desktop"
path = "src/main.rs"
